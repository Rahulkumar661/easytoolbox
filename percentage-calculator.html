
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - EasyToolBox</title>

    <meta name="description" content="Free Percentage Calculator to calculate percentages quickly and easily.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="nav-logo">
        EasyToolBox
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#tools">All Tools</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>

<main class="calculator-container">

    <h1>Percentage Calculator</h1>

    <p style="text-align:center;">
        Calculate percentages quickly and easily.
    </p>

    <label for="number">What is</label>

    <input type="number" id="number" placeholder="Enter number">

    <label for="percent">percent of</label>

    <input type="number" id="percent" placeholder="Enter percentage">

    <button onclick="calculatePercentage()">
        Calculate
    </button>

    <div class="result" id="result">
        Result will appear here
    </div>

</main>

<footer>

    <p>© 2026 EasyToolBox</p>

    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
    </div>

</footer>

<script>

function calculatePercentage() {

    const number = parseFloat(document.getElementById("number").value);
    const percent = parseFloat(document.getElementById("percent").value);

    const resultBox = document.getElementById("result");

    if (isNaN(number) || isNaN(percent)) {

        resultBox.innerHTML = "Please enter both numbers.";

        return;
    }

    const result = (percent / 100) * number;

    resultBox.innerHTML =
        percent + "% of " + number + " = <strong>" +
        result.toFixed(2) +
        "</strong>";
}

</script>

</body>

</html>
