<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - EasyToolBox</title>

    <meta name="description" content="Free online age calculator to calculate your exact age in years, months and days.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="nav-logo">
        EasyToolBox
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#tools">All Tools</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>


<main class="calculator-container">

    <h1>Age Calculator</h1>

    <label for="birthDate">Enter Your Date of Birth</label>

    <input type="date" id="birthDate">

    <button onclick="calculateAge()">
        Calculate Age
    </button>

    <div class="result">

        <p id="ageResult">
            Enter your date of birth and click Calculate.
        </p>

    </div>

</main>


<footer>

    <p>© 2026 EasyToolBox</p>

    <div class="footer-links">

        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>

    </div>

</footer>


<script>

function calculateAge() {

    const birthDateInput = document.getElementById("birthDate").value;
    const result = document.getElementById("ageResult");

    if (!birthDateInput) {
        result.textContent = "Please select your date of birth.";
        return;
    }

    const birthDate = new Date(birthDateInput + "T00:00:00");
    const today = new Date();

    if (birthDate > today) {
        result.textContent = "Date of birth cannot be in the future.";
        return;
    }

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months--;

        const previousMonth = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        );

        days += previousMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    result.textContent =
        "Your age is " +
        years + " years, " +
        months + " months and " +
        days + " days.";

}

</script>

</body>
</html>
